<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skroot</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f5fb;
    --fg: #1b1b22;
    --muted: #5d5d6b;
    --card: #ffffff;
    --line: rgba(0,0,0,0.08);
    --accent: #3F51B5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121218;
      --fg: #ececf2;
      --muted: #9a9aa8;
      --card: #1c1c24;
      --line: rgba(255,255,255,0.10);
      --accent: #8c9eff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  main { width: 100%; max-width: 620px; }
  h1 { font-size: 1.9rem; margin: 0 0 6px; letter-spacing: -0.01em; }
  .lede { color: var(--muted); margin: 0 0 36px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  a.app {
    display: block;
    padding: 16px 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    text-decoration: none;
    color: inherit;
  }
  a.app:hover { border-color: var(--accent); }
  .name { font-weight: 600; }
  .desc { color: var(--muted); font-size: 0.92rem; }
  footer { margin-top: 40px; color: var(--muted); font-size: 0.85rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Skroot</h1>
  <p class="lede">Small, quiet Android games.</p>

  <ul>
    <li>
      <a class="app" href="https://play.google.com/store/apps/details?id=com.tessera.blockpuzzle">
        <div class="name">Tessera &middot; Block Puzzle</div>
        <div class="desc">A 10&times;10 block puzzle with no timer and no lives.</div>
      </a>
    </li>
  </ul>

  <footer>
    <p>
      Privacy policies:
      <a href="https://siraj-ur-rahman.github.io/tessera-site/privacy-policy.html">Tessera</a>
    </p>
    <p>Contact: sirajurrahman19@gmail.com</p>
  </footer>
</main>
</body>
</html>
